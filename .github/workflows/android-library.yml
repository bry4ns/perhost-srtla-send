name: Android SRTLA library build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android-library:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android library and JNI for all configured ABIs
        run: gradle :srtla-lib:assembleDebug --stacktrace --no-daemon
